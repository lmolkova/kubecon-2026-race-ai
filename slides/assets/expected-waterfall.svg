  <rect x="145" y="475" width="1235" height="151" rx="8" fill="#eff6ff"/>
  <g font-family="Arial, sans-serif" font-size="24" fill="#172b4d">
    <text x="28" y="38" font-weight="700">Expected trace</text>
    <text x="650" y="38" fill="#596579">Time →</text>
    <path d="M650 60V694 M830 60V694 M1010 60V694 M1190 60V694 M1370 60V694" stroke="#e5e9f0"/>
    <g stroke="#ccd3df" fill="none" stroke-width="2">
      <path d="M38 95V141H60 M70 150V661H92 M70 193H92 M70 245H92 M70 401H92 M102 254V297H124 M134 306V349H156 M102 410V453H124 M134 462V505H156 M166 514V557H188 M198 566V609H220"/>
    </g>
    <text x="28" y="90">POST /run</text>
    <text x="60" y="142">invoke_workflow diagnose_workload</text>
    <text x="92" y="194">chat gpt-4.1</text>
    <text x="92" y="246">execute_tool inspect_workload</text>
    <text x="124" y="298">invoke_agent diagnostic</text>
    <text x="156" y="350">chat claude-sonnet-4-6</text>
    <text x="92" y="402">execute_tool consult_runbook</text>
    <text x="124" y="454">POST /runbook · HTTP client</text>
    <text x="156" y="506">POST /runbook · HTTP server</text>
    <text x="188" y="558">invoke_agent runbook</text>
    <text x="220" y="610">chat gpt-4.1-mini</text>
    <text x="92" y="662">chat gpt-4.1</text>
    <text x="28" y="740" font-size="20" fill="#596579">Blue area: runbook service · intended nesting and names · illustrative timing</text>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="764" viewBox="0 0 1400 764" role="img" aria-labelledby="title desc">
  <title id="title">Expected trace waterfall</title>
  <desc id="desc">POST /run contains diagnose_workload. The workflow makes two model calls and invokes two tools. The diagnostic agent runs locally. The runbook tool makes an HTTP client call to a separate service, whose HTTP server span contains the runbook agent and its model call. Bar lengths are illustrative.</desc>

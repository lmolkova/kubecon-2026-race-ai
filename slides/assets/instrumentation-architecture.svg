      <title id="diagram-title">How did we instrument the application?</title>
      <desc id="diagram-description">A LangGraph workflow calls ChatOpenAI, a local diagnostic agent through inspect_workload, and a remote runbook agent through consult_runbook over HTTP. The diagnostic agent calls ChatAnthropic with the Anthropic SDK. The runbook agent calls the OpenAI SDK. OpenInference instruments the workflow, diagnostic agent, and their model calls; the Anthropic call also uses native OTel. LangSmith OTLP instruments the runbook agent and model call.</desc>
      <style>
        svg { font-family: "Segoe UI", Aptos, Calibri, sans-serif; }
        text { fill: var(--cp-text); font-size: 26px; text-anchor: middle; }
        .title { font-size: 44px; font-weight: 600; text-anchor: start; }
        .service { font-size: 28px; font-weight: 600; text-anchor: start; }
        .detail { font-size: 22px; fill: var(--cp-text-muted); }
        .instrumentation-label { font-size: 18px; fill: var(--cp-text-muted); }
        .instrumentation { font-size: 20px; }
        .operation { font-weight: 600; }
        .container { fill: none; stroke: var(--cp-border-strong); stroke-width: 1.5; }
        .node { fill: var(--cp-surface); stroke: var(--cp-border-strong); stroke-width: 2; }
        .connector { fill: none; stroke: var(--cp-text-muted); stroke-width: 2; marker-end: url(#arrow); }
      </style>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">

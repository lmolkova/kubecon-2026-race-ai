      <text x="538" y="383" class="instrumentation">OpenInference</text>

      <rect x="414" y="456" width="248" height="112" class="node"/>
      <text x="538" y="501" class="operation">consult_runbook</text>
      <text x="538" y="536" class="detail">Tool</text>


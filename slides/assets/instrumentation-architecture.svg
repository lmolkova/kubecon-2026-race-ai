      <title id="diagram-title">How did we instrument the application?</title>
      <desc id="diagram-description">A LangGraph workflow calls an OpenAI model, a local diagnostic agent through inspect_workload, and a remote runbook agent through consult_runbook over HTTP. The diagnostic agent calls an Anthropic model. The runbook agent calls an OpenAI model. OpenInference instruments the workflow, diagnostic agent, and their model calls; the Anthropic call also uses native OTel, so it produces two inference spans. LangSmith instruments the runbook agent and model call. Each box has a footer strip colored and labeled by instrumentation source: teal for OpenInference, blue for native OTel, and plum for LangSmith.</desc>
      <style>
        svg { font-family: "Segoe UI", Aptos, Calibri, sans-serif; }
        text { fill: var(--cp-text); font-size: 26px; text-anchor: middle; }
        .title { font-size: 44px; font-weight: 600; text-anchor: start; }
        .service { font-size: 28px; font-weight: 600; text-anchor: start; }
        .detail { font-size: 22px; fill: var(--cp-text-muted); }
        .source { stroke-width: 2; }
        .openinference { fill: #0f8188; stroke: #0f8188; }
        .native-otel { fill: #425cc7; stroke: #425cc7; }
        .langsmith { fill: #a3367a; stroke: #a3367a; }
        .source-name { fill: #ffffff; font-size: 20px; font-weight: 600; }
        .badge { fill: #f5a800; }
        .badge-text { fill: #242424; font-size: 18px; font-weight: 600; }
        .operation { font-weight: 600; }
        .container { fill: none; stroke: var(--cp-border-strong); stroke-width: 1.5; }
        .node { fill: var(--cp-surface); stroke: var(--cp-border-strong); stroke-width: 2; }
        .connector { fill: none; stroke: var(--cp-text-muted); stroke-width: 2; marker-end: url(#arrow); }
      </style>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="var(--cp-text-muted)" stroke-width="1.5"/>
        </marker>
      </defs>
      <rect width="1440" height="810" fill="var(--cp-surface)"/>


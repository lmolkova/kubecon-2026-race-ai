<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
<title id="title">GenAI operations in a trace waterfall</title>
<desc id="desc">Agent or workflow contains sibling tool execution, inference, and retrieval operations. HTTP is beneath inference. Embeddings and database operations are beneath retrieval. Agent or workflow, tools, and inference are bold to mark the stability targets. HTTP and database operations use core semantic conventions and are grey.</desc>

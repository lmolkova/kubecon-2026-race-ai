<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Race to Standardize AI Observability</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main { position: relative; height: calc(100dvh - 64px); overflow: hidden; }
    #deck { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; }
    .slide {
      position: absolute; inset: 0; padding: 48px;
      background: var(--cp-surface); visibility: hidden;
      border-radius: 16px; font-size: 26px; line-height: 1.4;
    }
    .slide.active { visibility: visible; }
    .content { transform-origin: top left; }
    h1 { font-size: 44px; line-height: 1.15; margin: 0 0 28px; }
    p, ul, ol, pre, table { margin: 0 0 20px; }
    li { margin-bottom: 12px; }
    a { color: var(--cp-link); }
    img { display: block; max-width: 100%; max-height: 500px !important; margin: auto; object-fit: contain; }
    pre {
      padding: 20px; border-radius: 0.625rem; background: var(--cp-surface-soft);
      font-size: 19px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    code { font-family: Consolas, "Courier New", Courier, monospace; }
    table { width: 100%; border-collapse: collapse; font-size: 24px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--cp-border); }
    .mermaid { display: flex; justify-content: center; }
    .mermaid svg { max-width: 100%; max-height: 500px; }
    nav {
      height: 64px; display: flex; align-items: center; justify-content: center;
      gap: 16px; padding: 12px; color: var(--cp-text-muted);
    }
    button {
      padding: 8px 16px; border: 1px solid var(--cp-border); border-radius: 0.625rem;
      background: var(--cp-surface); color: var(--cp-text); cursor: pointer; font: inherit;
    }
    button:disabled { cursor: default; opacity: 0.5; }
    button:hover:not(:disabled) { border-color: var(--cp-accent); }
    #status { position: fixed; inset: 24px; z-index: 2; background: var(--cp-bg); padding: 24px; }
    #status[hidden] { display: none; }
    #status.error { color: var(--cp-danger); }
    @media (max-width: 640px) { .hint { display: none; } nav { gap: 8px; } }
  </style>
</head>
<body>
  <div id="status" role="status">Loading the deck and diagram renderer...</div>
  <main><div id="deck" aria-label="Presentation"></div></main>
  <nav aria-label="Slide controls">
    <button id="previous" disabled aria-label="Previous slide">Previous</button>
    <span id="counter" aria-live="polite"></span>
    <button id="next" disabled aria-label="Next slide">Next</button>
    <button id="fullscreen" disabled>Full screen</button>
    <span class="hint">Arrow keys to navigate. F for full screen.</span>
  </nav>
  <script type="module">
    const status = document.querySelector("#status");
    const deck = document.querySelector("#deck");
    const previous = document.querySelector("#previous");
    const next = document.querySelector("#next");
    const fullscreen = document.querySelector("#fullscreen");
    let slides = [];
    let current = 0;

    function resize() {
      const area = document.querySelector("main");
      deck.style.transform = `translate(-50%, -50%) scale(${Math.min(area.clientWidth / 1280, area.clientHeight / 720)})`;
    }

    function show(index) {
      current = Math.max(0, Math.min(index, slides.length - 1));
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === current);
        slide.setAttribute("aria-hidden", String(i !== current));
        slide.inert = i !== current;
      });
      document.querySelector("#counter").textContent = `${current + 1} / ${slides.length}`;
      previous.disabled = current === 0;
      next.disabled = current === slides.length - 1;
      history.replaceState(null, "", `#${current + 1}`);
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (error) {
        alert(`Full screen could not be opened: ${error.message}`);
      }
    }

    function splitSlides(markdown) {
      const chunks = [""];
      let fence = null;
      for (const line of markdown.split(/\r?\n/)) {
        const match = line.match(/^ {0,3}(`{3,}|~{3,})/);
        if (match) {
          if (!fence) fence = match[1];
          else if (match[1][0] === fence[0] && match[1].length >= fence.length) fence = null;
        }
        if (!fence && /^---\s*$/.test(line)) chunks.push("");
        else chunks[chunks.length - 1] += `${line}\n`;
      }
      return chunks.filter(chunk => chunk.trim());
    }

    try {
      const [{ marked }, { default: mermaid }, response] = await Promise.all([
        import("https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.esm.js"),
        import("https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs"),
        fetch("kubecon-genai.md")
      ]);
      if (!response.ok) throw new Error(`Deck request failed: HTTP ${response.status}`);
      for (const chunk of splitSlides(await response.text())) {
        const slide = document.createElement("section");
        slide.className = "slide";
        const content = document.createElement("div");
        content.className = "content";
        content.innerHTML = marked.parse(chunk);
        slide.append(content);
        deck.append(slide);
      }
      slides = [...deck.children];
      for (const code of deck.querySelectorAll("pre > code.language-mermaid")) {
        const diagram = document.createElement("div");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
      }
      const css = getComputedStyle(document.documentElement);
      mermaid.initialize({
        startOnLoad: false, theme: "base",
        flowchart: { wrappingWidth: 600 },
        themeVariables: {
          primaryColor: css.getPropertyValue("--cp-surface-soft").trim(),
          primaryTextColor: css.getPropertyValue("--cp-text").trim(),
          primaryBorderColor: css.getPropertyValue("--cp-border-strong").trim(),
          lineColor: css.getPropertyValue("--cp-text-muted").trim(),
          secondaryColor: css.getPropertyValue("--cp-accent-soft").trim(),
          tertiaryColor: css.getPropertyValue("--cp-bg").trim(),
          fontFamily: "Segoe UI, Aptos, Calibri, sans-serif"
        }
      });
      await mermaid.run({ nodes: [...deck.querySelectorAll(".mermaid")] });
      await Promise.all([...deck.querySelectorAll("img")].map(image => image.decode()));
      await document.fonts.ready;
      for (const slide of slides) {
        const content = slide.firstElementChild;
        const scale = Math.min(1, 624 / content.scrollHeight, 1184 / content.scrollWidth);
        content.style.transform = `scale(${scale})`;
      }
      previous.onclick = () => show(current - 1);
      next.onclick = () => show(current + 1);
      fullscreen.onclick = toggleFullscreen;
      fullscreen.disabled = false;
      window.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest("button, a")) return;
        if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(event.key)) show(current + 1);
        else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(event.key)) show(current - 1);
        else if (event.key === "Home") show(0);
        else if (event.key === "End") show(slides.length - 1);
        else if (event.key.toLowerCase() === "f") toggleFullscreen();
        else return;
        event.preventDefault();
      });
      window.addEventListener("hashchange", () => show((Number(location.hash.slice(1)) || 1) - 1));
      show((Number(location.hash.slice(1)) || 1) - 1);
      status.hidden = true;
      resize();
    } catch (error) {
      status.classList.add("error");
      status.textContent = `Cannot load the presentation: ${error.message}. Serve this folder over HTTP and check access to cdn.jsdelivr.net.`;
      console.error(error);
    }
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
